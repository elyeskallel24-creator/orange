<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORANGE</title>
  <!-- EASTER EGG: One of the heavy reasons in creating orange was to pay homage to gg33 & Garry Grinberg, thank you Garry for everything. -->
  <script type="importmap">
    {
      "imports": {
        "web-llm": "https://esm.sh/@mlc-ai/web-llm@0.2.73",
        "@huggingface/transformers": "https://esm.sh/@huggingface/transformers@3.0.0"
      }
    }
  </script>
  <style>
    :root {
      --bg: oklch(0.15 0.02 250);
      --fg: oklch(0.95 0.01 250);
      --accent: oklch(0.75 0.18 50);
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main { flex: 1; display: grid; place-items: center; position: relative; }
    #orb { width: 300px; height: 300px; position: absolute; z-index: 0; opacity: 0.8; }
    .ui-layer { position: relative; z-index: 1; text-align: center; }
    footer { text-align: center; padding: 1rem; font-size: 0.8rem; opacity: 0.6; user-select: none; }
    .easter-egg-trigger { cursor: pointer; opacity: 0.3; transition: opacity 0.3s; }
    .easter-egg-trigger:hover { opacity: 1; }
    #cmd-palette {
      display: none; position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 600px; background: oklch(0.2 0.02 250); border: 1px solid var(--accent);
      border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100; padding: 1rem;
    }
    #cmd-palette input { width: 100%; background: transparent; border: none; color: var(--fg); font-size: 1.2rem; outline: none; font-family: inherit; }
    #cmd-palette.active { display: block; }
    #easter-egg-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999; place-items: center; text-align: center; }
    #easter-egg-overlay.active { display: grid; }
    #easter-egg-text { color: var(--accent); font-size: 1.5rem; max-width: 80%; line-height: 1.6; }
    #status { margin-top: 1rem; font-size: 0.9rem; color: var(--fg); opacity: 0.8; }
  </style>
</head>
<body>
  <main>
    <canvas id="orb"></canvas>
    <div class="ui-layer">
      <h1 style="color: var(--accent); cursor: pointer;" id="logo">ORANGE</h1>
      <p>Describe it. Orange compiles it. Watch it think.</p>
      <button id="open-cmd" style="margin-top: 1rem; background: var(--accent); color: var(--bg); border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: bold;">Open Command (Ctrl+K)</button>
      <div id="status">Initializing engine...</div>
    </div>
  </main>
  <div id="cmd-palette">
    <input type="text" id="cmd-input" placeholder="Describe an automation..." autocomplete="off">
  </div>
  <div id="easter-egg-overlay">
    <p id="easter-egg-text"></p>
  </div>
  <footer>
    made with love by Elyes Kallel with the spirit of BXB <span class="easter-egg-trigger" id="ee-trigger">33</span>
  </footer>
  <script type="module" src="./main.js"></script>
</body>
</html>
