<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORANGE</title>
  <!-- EASTER EGG: One of the heavy reasons in creating orange was to pay homage to gg33 & Garry Grinberg, thank you Garry for everything. -->
  <script type="importmap">
    {
      "imports": {
        "web-llm": "https://unpkg.com/@mlc-ai/web-llm@0.2.73/lib/index.js",
        "@huggingface/transformers": "https://esm.sh/@huggingface/transformers@3.0.0"
      }
    }
  </script>
  <style>
    :root {
      --bg-primary: oklch(0.12 0.01 250);
      --bg-surface: oklch(0.16 0.01 250);
      --fg-primary: oklch(0.95 0.01 250);
      --fg-muted: oklch(0.65 0.01 250);
      --accent: oklch(0.75 0.18 50);
      --border: oklch(0.25 0.01 250);
      --border-active: oklch(0.75 0.18 50);
      --success: oklch(0.75 0.15 150);
      --warning: oklch(0.75 0.15 80);
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-sans: system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg-primary);
      color: var(--fg-primary);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .app-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr;
      gap: 1px;
      background: var(--border);
    }
    .pane {
      background: var(--bg-primary);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pane-header {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--fg-muted);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    /* Pane 1: Prompt */
    .pane-prompt { display: flex; flex-direction: column; gap: 1rem; }
    #logo { font-size: 2rem; font-weight: bold; color: var(--accent); cursor: pointer; margin: 0; }
    .tagline { color: var(--fg-muted); font-size: 0.9rem; line-height: 1.5; }
    #cmd-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--fg-primary);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0.75rem;
      border-radius: 2px;
      outline: none;
    }
    #cmd-input:focus { border-color: var(--border-active); }
    .hint { font-size: 0.75rem; color: var(--fg-muted); font-family: var(--font-mono); }

    /* Pane 2: Flow */
    .pane-flow { position: relative; display: grid; place-items: center; }
    #orb { width: 250px; height: 250px; position: absolute; z-index: 0; opacity: 0.8; }
    .flow-placeholder {
      z-index: 1;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--fg-muted);
      text-align: center;
      border: 1px dashed var(--border);
      padding: 2rem;
      border-radius: 2px;
    }

    /* Pane 3: Cortex */
    .pane-cortex { font-family: var(--font-mono); font-size: 0.8rem; }
    #status { 
      padding: 0.5rem; 
      background: var(--bg-surface); 
      border-left: 2px solid var(--border);
      margin-bottom: 1rem;
    }
    #cortex {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 1rem;
      overflow-y: auto;
      border-radius: 2px;
    }
    #cortex pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; }

    /* Footer & Easter Egg */
    footer {
      text-align: center;
      padding: 0.75rem;
      font-size: 0.75rem;
      color: var(--fg-muted);
      border-top: 1px solid var(--border);
      user-select: none;
    }
    .easter-egg-trigger { cursor: pointer; opacity: 0.3; transition: opacity 0.3s; }
    .easter-egg-trigger:hover { opacity: 1; }
    #easter-egg-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
      z-index: 999; place-items: center; text-align: center;
    }
    #easter-egg-overlay.active { display: grid; }
    #easter-egg-text { color: var(--accent); font-size: 1.5rem; max-width: 80%; line-height: 1.6; font-family: var(--font-mono); }

    /* Responsive */
    @media (max-width: 1024px) {
      .app-container { grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; }
      .pane-prompt { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 1rem; }
      .pane-prompt .tagline { display: none; }
    }
    @media (max-width: 768px) {
      .app-container { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
      .pane-prompt { flex-direction: column; align-items: stretch; }
      .pane-flow { min-height: 200px; }
      .pane-cortex { max-height: 40vh; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="pane pane-prompt">
      <div>
        <h1 id="logo">ORANGE</h1>
        <p class="tagline">Describe it. Orange compiles it. Watch it think.</p>
      </div>
      <div style="flex:1">
        <input type="text" id="cmd-input" placeholder="Describe an automation..." autocomplete="off">
        <div class="hint">Press Enter to compile. Ctrl+K to focus.</div>
      </div>
    </div>
    
    <div class="pane pane-flow">
      <canvas id="orb"></canvas>
      <div class="flow-placeholder">
        DAG Visualization<br>
        <span style="font-size:0.7rem; opacity:0.6;">(Vertical slice: placeholder)</span>
      </div a>
    </div>
    
    <div class="pane pane-cortex">
      <div class="pane-header">Cortex / Metrics</div>
      <div id="status">Initializing engine...</div>
      <div id="cortex">
        <pre>Awaiting compilation...</pre>
      </div>
    </div>
  </div>

  <div id="easter-egg-overlay">
    <p id="easter-egg-text"></p>
  </div>

  <footer>
    made with love by Elyes Kallel with the spirit of BXB <span class="easter-egg-trigger" id="ee-trigger">33</span>
  </footer>
  <script type="module" src="./main.js"></script>
</body>
</html>
